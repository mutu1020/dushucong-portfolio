name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Set GitHub Actions as the Pages source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          repo="${{ github.repository }}"
          if gh api "repos/${repo}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            echo "Pages site already exists"
            cat /tmp/pages.json
            gh api --method PUT "repos/${repo}/pages" -f build_type=workflow
          else
            echo "Pages site is not configured yet"
            cat /tmp/pages.err
            gh api --method POST "repos/${repo}/pages" -f build_type=workflow
          fi
          echo "---- current pages config ----"
          gh api "repos/${repo}/pages"
